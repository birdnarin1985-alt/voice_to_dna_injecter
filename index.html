<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หจก. เชียงใหม่ 63 การช่าง - Multi-View Earthwork & Depth Profile</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(22, 27, 34, 0.92);
            --border-color: rgba(48, 54, 61, 0.8);
            --accent-green: #00ff66;
            --accent-blue: #0a84ff;
            --accent-orange: #ff9f0a;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-color); font-family: var(--font-ios); overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Floating Control Panel (iOS Glassmorphism) */
        .control-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            z-index: 10;
            box-shadow: 0 12px 40px rgba(0, 255, 102, 0.15);
            color: var(--text-main);
            box-sizing: border-box;
        }
        h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; text-align: center; }
        .subtitle { font-size: 11px; color: var(--accent-green); text-align: center; margin-bottom: 12px; font-weight: 500; }
        
        /* Multi-View Tabs */
        .view-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .view-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 4px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .view-btn.active { background: var(--accent-green); color: #000; border-color: var(--accent-green); }

        .profile-canvas-box { width: 100%; height: 130px; background: #030508; border: 1px dashed var(--accent-orange); border-radius: 10px; margin-top: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px; box-sizing: border-box; text-align: center; font-size: 11px; color: var(--text-sub); }

        .ios-btn { width: 100%; background: var(--accent-green); color: #000; border: none; padding: 12px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 12px rgba(0,255,102,0.2); }
        .ios-btn:active { transform: scale(0.97); opacity: 0.85; }
        .ios-btn.blue { background: var(--accent-blue); color: #fff; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div class="control-panel">
        <h3>หจก. เชียงใหม่ 63 การช่าง</h3>
        <div class="subtitle">ระบบ Multi-View Earth Slicing (Top, Front, Side Profile)</div>
        
        <!-- Multi-View Selection Tabs -->
        <div class="view-tabs">
            <button id="v-top" class="view-btn active" onclick="switchViewMode('top')">1. Top View (แปลน)</button>
            <button id="v-front" class="view-btn" onclick="switchViewMode('front')">2. Front (ตัดหน้า)</button>
            <button id="v-side" class="view-btn" onclick="switchViewMode('side')">3. Side (ตัดข้าง)</button>
        </div>

        <div id="view-desc" style="font-size: 12px; color: var(--accent-orange); margin-bottom: 8px; text-align: center;">
            📍 สถานะ: มุมมองแปลนพื้นด้านบน (Top-Down Orthographic)
        </div>

        <!-- Canvas แสดง Profile ความลึกดิน (Cut & Fill Slicing) -->
        <div class="profile-canvas-box" id="profile-view-box">
            <span>[กราฟตัดขวางชั้นดิน: ความลึกขุด 1.5 ม. | ถม 0.8 ม.]</span>
            <div style="color:var(--accent-green); margin-top:4px; font-weight:bold;">ดินขุด (Cut): 3,600 คิว | ดินถม (Fill): 1,800 คิว</div>
        </div>

        <button class="ios-btn" onclick="resetCameraView()">🔄 รีเซ็ตมุมมองพอยเตอร์ 3D</button>
    </div>

    <script>
        Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_ACCESS_TOKEN_HERE';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false, baseLayerPicker: false, geocoder: false,
            homeButton: false, infoBox: false, sceneModePicker: false,
            selectionIndicator: false, timeline: false, navigationHelpButton: false
        });

        const targetLat = 18.788300;
        const targetLon = 98.985300;

        function switchViewMode(mode) {
            document.querySelectorAll('.view-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`v-${mode}`).classList.add('active');

            let heading = 0, pitch = -90, range = 800;
            let desc = "";

            if (mode === 'top') {
                heading = 0.0; pitch = -90.0; range = 900;
                desc = "📍 สถานะ: มุมมองแปลนพื้นด้านบน (Top-Down Orthographic)";
            } else if (mode === 'front') {
                heading = 0.0; pitch = -15.0; range = 700;
                desc = "📐 สถานะ: มุมมองตัดขวางด้านหน้า (Front View X-Z Profile)";
            } else if (mode === 'side') {
                heading = 90.0; pitch = -15.0; range = 700;
                desc = "📐 สถานะ: มุมมองตัดขวางด้านข้าง (Side View Y-Z Profile)";
            }

            document.getElementById('view-desc').innerText = desc;

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(targetLon, targetLat, range),
                orientation: {
                    heading: Cesium.Math.toRadians(heading),
                    pitch: Cesium.Math.toRadians(pitch),
                    roll: 0.0
                },
                duration: 1.5
            });

            if (navigator.vibrate) navigator.vibrate(40);
        }

        function resetCameraView() {
            switchViewMode('top');
        }

        // เริ่มต้นด้วย Top View
        switchViewMode('top');
    </script>
</body>
</html>
