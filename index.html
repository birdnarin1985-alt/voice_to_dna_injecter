<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หจก. เชียงใหม่ 63 การช่าง - ระบบ 3D Terrain ฟรี 100% (Open-Source)</title>
    <!-- โหลด CesiumJS โค้ดเปิด -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(22, 27, 34, 0.92);
            --border-color: rgba(48, 54, 61, 0.8);
            --accent-green: #00ff66;
            --accent-blue: #0a84ff;
            --accent-gold: #d29922;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-color); font-family: var(--font-ios); overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .control-panel {
            position: absolute;
            top: 16px; left: 16px; right: 16px; max-width: 440px;
            background: var(--card-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 16px;
            z-index: 10; box-shadow: 0 12px 40px rgba(0, 255, 102, 0.15); color: var(--text-main); box-sizing: border-box;
        }
        h3 { margin: 0 0 4px 0; font-size: 16px; color: #fff; text-align: center; }
        .subtitle { font-size: 11px; color: var(--accent-green); text-align: center; margin-bottom: 12px; font-weight: 500; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        input { width: 100%; padding: 10px; background: rgba(13, 17, 23, 0.9); border: 1px solid var(--border-color); color: #fff; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; }
        .ios-btn { width: 100%; background: var(--accent-green); color: #000; border: none; padding: 12px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 12px rgba(0,255,102,0.2); }
        .ios-btn:active { transform: scale(0.97); opacity: 0.85; }
        .ios-btn.blue { background: var(--accent-blue); color: #fff; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div class="control-panel">
        <h3>หจก. เชียงใหม่ 63 การช่าง</h3>
        <div class="subtitle">ระบบ 3D Terrain สำรวจพื้นที่ฟรี 100% (No Token Fee)</div>
        
        <div class="form-group">
            <label>วางลิงก์ Google Maps / พิกัดเป้าหมาย:</label>
            <input type="text" id="target-link" value="https://maps.app.goo.gl/k6rszxtbnSjoWtrE6">
        </div>

        <button class="ios-btn" onclick="flyToFreeTerrain()">🌐 พอยเตอร์บินสู่พิกัด 3D (ฟรี)</button>
    </div>

    <script>
        // ใช้ Cesium Viewer โดยไม่ต้องใส่ Ion Token (ใช้ Open-Source Terrain & Esri Satellite ฟรี)
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false, baseLayerPicker: false, geocoder: false,
            homeButton: false, infoBox: false, sceneModePicker: false,
            selectionIndicator: false, timeline: false, navigationHelpButton: false,
            // ดึงภาพถ่ายดาวเทียมฟรีผ่าน Esri MapServer
            imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
            }),
            // ดึงภูมิประเทศ 3D พื้นผิวโลกฟรีผ่าน Cesium World Terrain สาธารณะ
            terrainProvider: Cesium.createWorldTerrain()
        });

        // พิกัดเป้าหมายในเชียงใหม่จากลิงก์ที่ช่างเบิร์ดส่งมา
        const targetLat = 18.788300;
        const targetLon = 98.985300;

        function flyToFreeTerrain() {
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(targetLon, targetLat, 800),
                orientation: {
                    heading: Cesium.Math.toRadians(0.0),
                    pitch: Cesium.Math.toRadians(-45.0),
                    roll: 0.0
                },
                duration: 2.0
            });
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // เริ่มต้นบินไปที่พิกัดทันที
        flyToFreeTerrain();
    </script>
</body>
</html>
